# Typecheck, lint, test and build on every push and pull request.
#
# This is the feedback surface: it annotates pull requests and gives a red tick on a bad
# push. It is NOT what stops a broken deploy, because Vercel builds a push at the same time
# this runs and would not wait for it.
#
# The deploy gate is package.json's `vercel-build`, which Vercel runs in preference to
# `build`: it runs `npm run check` (typecheck, lint, tests) first, so a failure fails the
# Vercel build and the previous deployment stays live.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same command the Vercel build runs, so a green tick here means that gate will pass.
      - name: Typecheck, lint and test
        run: npm run check

      # Supabase's public URL and publishable key let the build prerender real pages. Both
      # are public by definition (they ship in the client bundle) and the secret key is
      # never used at build time. If the secrets are not set the build still passes: the
      # query layer degrades to empty results, so this stays a compile check either way.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
