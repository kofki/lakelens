# Typecheck, lint, test and build on every push and pull request.
#
# This does NOT deploy: Vercel already builds and promotes every push to main through its
# own Git integration. This is the check that was missing, so a broken build is caught in
# the pull request rather than in production.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx vitest run

      # Supabase's public URL and publishable key let the build prerender real pages. Both
      # are public by definition (they ship in the client bundle) and the secret key is
      # never used at build time. If the secrets are not set the build still passes: the
      # query layer degrades to empty results, so this stays a compile check either way.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
